# === EOG Artifact Augmentation ===
eog_artifact: !new:speechbrain_eog_artifact.SpeechBrainEOGArtifact
    scale_factor: 4.0
    sample_rate: 250
    seed: 42

# === Augmenter Wrapper ===
augment: !new:speechbrain.augment.augmenter.Augmenter
    parallel_augment: False
    concat_original: True
    parallel_augment_fixed_bs: False
    repeat_augment: 1
    shuffle_augmentations: False
    min_augmentations: 1
    max_augmentations: 1
    augmentations: [!ref <eog_artifact>]
