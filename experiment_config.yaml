# Evaluation modes
eval_modes:
  - "CrossSession"
  - "WithinSession"
  - "CrossSubject"

noise_types:
  - "gaussian"
  - "dropout"
  - "eog"
  - "spike"

# Noise perturbation configuration
noise_perturbation:
  # Dynamic bounds are determined by saturation results
  # Bounds are set based on saturation_points_summary.csv
  # Each dataset + noise_type combination has its own bounds
  # Format: min_intensity = 1.0, max_intensity = saturation_point
  saturation_file: "saturation_results/saturation_points_summary.csv"
  num_steps: 20  # Number of intensity steps between min and max
  default_bounds: [1.0, 50.0]  # Fallback bounds if saturation data not available
  
  # Example bounds based on current saturation results:
  # BNCI2014_001 + dropout: 1.0 to 50.0 (saturation point: 50.0)
  # Lee2019_SSVEP + dropout: 1.0 to 100.0 (saturation point: 100.0)
  # All other combinations: 1.0 to 100.0 (saturation point: 100.0)

# Experiment modes (multirun approach)
experiment_modes:
  - name: "multirun"
    display_name: "Multirun (Test Perturb)"
    requires_noise: false  # Handled internally by multirun
    supports_tuning: true
    
# Random seeds for reproducibility
seeds:
  - 100
  - 200
  - 300
  - 400
  - 500

# Experiment settings
experiment_settings:
  # Legacy mode: If true, uses original experimental protocol (no subject chunking)
  # This disables memory optimizations to match the behavior of old_unified_experiment_runner.py
  # Can be overridden via --legacy command-line flag
  legacy: true

# Experiment filtering and prioritization
experiment_filters:
  # Skip certain combinations to reduce experiment size
  skip_combinations:
    # Skip test_perturb for certain models if they're too slow
    # - model: "cnn_ncp"
    #   mode: "test_perturb"
    
    # Skip certain eval modes for specific datasets
    # - dataset: "Lee2019_SSVEP"
    #   eval_mode: "CrossSubject"  # SSVEP might not support cross-subject well
  
  # Priority levels for experiment execution
  priority_levels:
    high:
      - all_remaining: true

# Output configuration
output:
  # Directory for generated shell scripts
  script_dir: "generated_scripts"
  
  # Directory for aggregated results
  results_dir: "evaluation/results"
  
  # Filename for the aggregated results
  aggregated_results_file: "all_results.csv"
  
  # Filename for missing experiments shell script
  missing_script_file: "run_missing_multirun_jobs.sh"
  
  # Python executable path (update this for your system)
  python_executable: "C:\\Users\\Kinah\\anaconda3\\envs\\ncp_robustness_proj\\python.exe"

# Command template for generating multirun experiment commands
command_template: |
  {python_executable} evaluation/unified_experiment_runner.py \
    --model {model} \
    --dataset {dataset} \
    --subjects {subjects_str} \
    --mode {mode} \
    --eval_mode {eval_mode} \
    --seed {seed} \
    {noise_args} \
    {tune_flag} \
    --overwrite


