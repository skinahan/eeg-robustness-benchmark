# Plot 2 Phase 4: Revised bounds for WS-Flex diversity (Plot_2_Investigation.txt)
# Use when Phase 1/2 show sparse/moderate regimes infeasible or dominated.
# Apply after auditing rewiring_prob vs p_rewiring (see arch_refinement_first_pass_details.txt).

generator:
  # Plain WS (current Plot 2): k, p only
  k_min: 2
  k_max: 30
  p_min: 0.0
  p_max: 1.0

  # WS-Flex (first-pass optimizer): when used, relax these for sparse feasibility
  target_clustering:
    low_k_upper: 0.5   # lower target_clustering for low k (was 0.01..1.0)
    default_range: [0.1, 0.9]
  target_path_length:
    low_k_upper: 6.0   # widen upper bound for low k (was 1.0..4.5)
    default_range: [2.0, 8.0]

  # Optional: allow disconnected with path_length on giant component
  allow_disconnected: false
  path_length_on_giant_component: true

  # Optional repair: if graph fails constraints, adjust k/p in neighborhood and retry
  repair_enabled: false
  repair_max_steps: 3

regime_bins:
  super_sparse: [2, 6]
  sparse: [7, 12]
  moderate: [13, 18]
  near_dense: [19, 26]

# Plot2_revision3 Step C: E_active bands per regime (H=32)
# E_active = H*k/2 for undirected WS; oriented keeps same edge count.
capacity_E_active_bands:
  super_sparse: [32, 96]    # k in [2,6]
  sparse: [112, 192]       # k in [7,12]
  moderate: [208, 288]     # k in [13,18]
  near_dense: [304, 416]   # k in [19,26]

# Audit note (Phase 4): In first-pass optimizer, 'rewiring_prob' is suggested by Optuna
# but only 'p_rewiring' is passed to _create_watts_strogatz_flex_graph. Ensure call sites
# use p_rewiring for the WS rewiring probability.
